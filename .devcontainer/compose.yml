services:
  app:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "3001:3000"
      - "5183:5173"
      - "5184:5174"

    environment:
      VITE_HMR_CLIENT_PORT: "5183"

    volumes:
      - ../:/workspace:cached
      - node_modules:/workspace/node_modules

    # rolldownのwatchモード(backend/frontend双方)がこのモノレポの規模だと
    # デフォルトのnofile(1024)を超えて"Too many open files"でクラッシュするため引き上げる
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    command: sleep infinity

    networks:
      - internal_network
      - external_network

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    networks:
      - internal_network
    volumes:
      - redis-data:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  db:
    restart: unless-stopped
    # pgroonga検索プロバイダのテスト用に、公式postgres:18-alpineをFROMにしたpgroonga同梱イメージへ変更
    # (https://github.com/pgroonga/docker)。データディレクトリ形式は同じpostgres 18のため
    # 既存のpostgres-dataボリュームはそのまま使える。
    image: groonga/pgroonga:latest-alpine-18
    networks:
      - internal_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: misskey
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

  # ローカルでメール送信を確認するためのSMTPキャッチャー。実際には配送せず、
  # 送信されたメールをWeb UI (http://localhost:8026) で確認できる。
  mailpit:
    restart: unless-stopped
    image: axllent/mailpit:latest
    networks:
      - internal_network
      - external_network
    ports:
      - "8026:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  node_modules:

networks:
  internal_network:
    internal: true
  external_network:
